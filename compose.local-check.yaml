# 本番イメージをローカルで動作確認するための上書き設定。
#
#   docker compose -f compose.yaml -f compose.local-check.yaml up -d --build
#
# ★本番では使わない。★
#
# なぜ必要か:
#   production.py は SECURE_SSL_REDIRECT=True なので、
#   HTTP で来たリクエストを HTTPS へリダイレクトする。
#   手元には証明書が無いので、そのままだと画面まで辿り着けない。
#
# ここで「TLS を終端したプロキシがいる」状態だけを真似る。
# 設定ファイルを差し替えるのは nginx 側だけで、
# **Django の本番設定には一切手を入れない**のが要点。
#
# もし production.py に「ローカル検証のときだけ HTTPS 強制を切る」
# 環境変数を足したら、その変数は本番でも読めてしまう。
# 検証のための逃げ道を本番設定に残さない。

services:
  nginx:
    volumes:
      - ./docker/nginx/local-check.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/var/www/static:ro
      - media:/var/www/media:ro
