# ローカル検証専用の nginx 設定。**本番では使わない。**
#
# default.conf との違いは1行だけ:
#   proxy_set_header X-Forwarded-Proto https;
#
# 本来は $scheme（実際に来たスキーム）を渡す。
# ここでは「TLS を終端したプロキシがいる」と Django に信じさせて、
# 証明書なしで本番設定のまま画面を確認できるようにしている。
#
# 本番でこれをやると、HTTP で来たリクエストまで HTTPS 扱いになり、
# SECURE_SSL_REDIRECT が意味を失う。絶対に混同しないこと。
#
# 使い方は compose.local-check.yaml を参照。

# nginx の役割は3つ。
#   1. 静的ファイルと画像を自分で返す（Django を呼ばない）
#   2. それ以外を Django へ転送する
#   3. アップロードの大きさなど、入口で切れるものを切る
#
# HTTPS の証明書はここには書かない。デプロイ編7日目で Let's Encrypt を扱う。
# この時点では 80 番だけを見る。

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Django 側の DATA_UPLOAD_MAX_MEMORY_SIZE と揃える。
    # ここが小さいと、Django へ届く前に 413 で切られる。
    # 逆にここだけ大きくしても Django が弾くので、両方を合わせる意味がある。
    client_max_body_size 6m;

    # nginx のバージョンを隠す。
    # 既知の脆弱性を持つ版かどうかを、外から確かめにくくする。
    server_tokens off;

    # ----------------------------------------------------------------------
    # 静的ファイル
    # ----------------------------------------------------------------------
    # ManifestStaticFilesStorage がファイル名に内容のハッシュを付けるので、
    # 内容が変われば URL も変わる。つまり長期キャッシュが安全にできる。
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------------------
    # アップロードされた画像
    # ----------------------------------------------------------------------
    location /media/ {
        alias /var/www/media/;
        access_log off;
        expires 7d;

        # ★重要★ アップロードされたファイルを絶対に実行させない。
        # 4日目に中身で検証しているとはいえ、多層で守る。
        # ここが抜けていると、画像に偽装したスクリプトを置かれたときに
        # サーバー側で実行される余地が生まれる。
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'";
        # PHP など、拡張子でハンドラが起動する設定を後から足しても
        # media 配下だけは巻き込まれないようにしておく。
        location ~ \.(php|phtml|py|pl|cgi|sh)$ {
            return 404;
        }
    }

    # ----------------------------------------------------------------------
    # Django
    # ----------------------------------------------------------------------
    location / {
        proxy_pass http://django;

        # Django が「元のリクエストがどう来たか」を知るために要る。
        # 特に X-Forwarded-Proto は、これが無いと Django が
        # 常に HTTP 扱いにして SECURE_SSL_REDIRECT が無限ループする。
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;  # ローカル検証用: TLS終端済みだと申告する

        proxy_redirect off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 監視は記録しない。数秒おきに来るのでログが埋まる。
    location /healthz/ {
        access_log off;
        proxy_pass http://django;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;  # ローカル検証用: TLS終端済みだと申告する
    }
}
